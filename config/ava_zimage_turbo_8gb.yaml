# Configuracion de AI-Toolkit (Ostris) para entrenar el LoRA "Ava" en Z-Image Turbo.
# VERSION 8 GB de VRAM (RTX 3060 Ti / 3070 / 4060 / 4060 Ti 8GB, etc.).
# Necesita 32 GB de RAM: parte del modelo se mueve a la RAM para que quepa.
# Es mas lenta que la de 16 GB (aprox. 3 a 6 horas).
# 1_INSTALAR.bat copia este archivo a C:\ai-toolkit\config\ y cambia __DATASET__
# por la ruta real de las fotos. No hace falta editarlo a mano.
---
job: extension
config:
  # nombre de la carpeta de salida y de los archivos .safetensors
  name: "ava_zimage_turbo_v1"
  process:
    - type: "diffusion_trainer"
      training_folder: "output"
      device: cuda
      # palabra clave para activar al personaje en el prompt
      trigger_word: "ava_lora"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: bf16
        save_every: 250            # guarda una version del LoRA cada 250 pasos
        max_step_saves_to_keep: 12 # conserva todas para elegir la mejor
        save_format: diffusers
      datasets:
        - folder_path: "__DATASET__"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          # sin 1024 para que quepa en 8 GB
          resolution: [512, 768]
          num_repeats: 1
      train:
        batch_size: 1
        steps: 3000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "weighted"
        content_or_style: "balanced"
        optimizer: "adamw8bit"
        optimizer_params:
          weight_decay: 0.0001
        lr: 0.0001
        unload_text_encoder: false
        # guarda las descripciones ya procesadas y saca el text encoder de la VRAM
        cache_text_embeddings: true
        dtype: bf16
      model:
        # modelo base oficial (se descarga solo de Hugging Face, ~20 GB la primera vez)
        name_or_path: "Tongyi-MAI/Z-Image-Turbo"
        arch: "zimage:turbo"
        # adaptador de Ostris: permite entrenar sobre Turbo sin "romper" la destilacion
        assistant_lora_path: "ostris/zimage_turbo_training_adapter/zimage_turbo_training_adapter_v2.safetensors"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: true
        # mueve parte del modelo a la RAM del sistema (clave para 8 GB)
        layer_offloading: true
        layer_offloading_transformer_percent: 0.6
        layer_offloading_text_encoder_percent: 1.0
      sample:
        sampler: "flowmatch"
        sample_every: 500
        width: 768
        height: 1152
        prompts:
          - "ava_lora, a selfie of a young woman in a coffee shop, wearing a black turtleneck, soft smile"
          - "ava_lora, a full body photo of a young woman walking in a park in autumn, wearing a beige trench coat"
          - "ava_lora, a close-up portrait of a young woman, studio lighting, neutral gray background"
          - "ava_lora, a photo of a young woman sitting on a couch reading a book, cozy living room, warm light"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 9
meta:
  name: "[name]"
  version: "1.0"
